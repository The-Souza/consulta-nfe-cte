name: CI

"on":
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  # The release runs this same gate before building, so a new check (e.g. mypy) can't be skipped there
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: lint + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
