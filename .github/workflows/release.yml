name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -r requirements-dev.txt
          .venv\Scripts\pip install pyinstaller

      - name: Check app version matches tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = .venv\Scripts\python.exe -c "import config; print(config.APP_VERSION)"
          if ("v$version" -cne $env:REF_NAME) {
            Write-Error "APP_VERSION ($version) does not match tag $env:REF_NAME"
            exit 1
          }

      - name: Lint
        run: .venv\Scripts\ruff.exe check .

      - name: Test
        run: .venv\Scripts\python.exe -m pytest

      - name: Build executable
        run: .\build.ps1

      - name: Zip dist folder
        run: Compress-Archive -Path dist\consulta-nfe-cte\* -DestinationPath consulta-nfe-cte.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: consulta-nfe-cte.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
